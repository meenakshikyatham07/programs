<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playable Ludo Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2)}
.container{display:flex;gap:25px;align-items:flex-start}.game-board{width:600px;height:600px;position:relative;background:#fff;border:5px solid #222;box-shadow:0 10px 35px #0005}.cell{position:absolute;width:40px;height:40px;border:1px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:10px}.cell.green{background:#b8efb8}.cell.yellow{background:#fff4a8}.cell.red{background:#ffc0cb}.cell.blue{background:#addcf0}.cell.start{border:3px solid #222}.home{width:200px;height:200px;position:absolute;border:3px solid #222;border-radius:12px;z-index:1}.home.green{background:#90ee90}.home.yellow{background:#ffff99}.home.red{background:#ffb6c6}.home.blue{background:#87ceeb}.piece{width:30px;height:30px;border-radius:50%;position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;border:2px solid #222;cursor:pointer;transition:all .25s}.piece.green{background:#228b22}.piece.yellow{background:#d4a900}.piece.red{background:#dc143c}.piece.blue{background:#00008b}.piece.movable{outline:4px solid #fff;box-shadow:0 0 0 6px #333;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.12)}}.sidebar{width:260px;background:#fff;padding:20px;border-radius:12px;box-shadow:0 5px 20px #0004}.sidebar h1{font-size:24px;margin-bottom:18px;color:#333}.dice-section{text-align:center;background:#f0f0f0;padding:18px;border-radius:8px}.dice{width:65px;height:65px;margin:10px auto;border:3px solid #333;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold;transition:transform .4s}.button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:6px;background:#667eea;color:white;font-weight:bold;cursor:pointer}.button:hover{background:#764ba2}.button:disabled{background:#aaa;cursor:not-allowed}.player-info{padding:10px;margin-top:8px;border-radius:6px;font-weight:bold}.player-info.green{background:#b8efb8;color:#176b17}.player-info.yellow{background:#fff4a8;color:#806600}.player-info.red{background:#ffc0cb;color:#a00020}.player-info.blue{background:#addcf0;color:#00008b}.player-info.active{outline:3px solid #222;transform:scale(1.04)}.status{margin-top:15px;padding:12px;background:#f7f7f7;border-radius:6px;line-height:1.4;min-height:55px;font-size:14px}.hint{font-size:12px;color:#666;margin-top:12px;line-height:1.4}@media(max-width:930px){.container{transform:scale(.82);transform-origin:top center;margin-bottom:-100px}}@media(max-width:700px){.container{flex-direction:column;align-items:center;transform:scale(.58);margin-bottom:-230px}.sidebar{width:600px}}
</style>
</head>
<body>
<div class="container">
  <div class="game-board" id="gameBoard"></div>
  <aside class="sidebar">
    <h1>🎲 Ludo Game</h1>
    <div class="dice-section"><strong id="turnTitle">Player 1's turn</strong><div class="dice" id="dice">🎲</div><button class="button" id="rollBtn">Roll Dice</button></div>
    <div style="margin-top:18px"><strong>Players</strong><div id="playersContainer"></div></div>
    <div class="status" id="statusText">Roll the dice to start.</div>
    <div class="hint">Roll a 6 to bring a piece out. After rolling, click a glowing piece to move it.</div>
    <button class="button" id="resetBtn">Reset Game</button>
  </aside>
</div>
<script>
const SIZE=40;
// 52 spaces around the outside of the 15x15 board.
const path=[];
for(let c=0;c<15;c++)path.push({x:c,y:6});
for(let r=7;r<15;r++)path.push({x:14,y:r});
for(let c=13;c>=0;c--)path.push({x:c,y:14});
for(let r=13;r>=0;r--)path.push({x:0,y:r});
for(let c=1;c<15;c++)path.push({x:c,y:0});
for(let r=1;r<6;r++)path.push({x:14,y:r});
// Use the first 52 unique route spaces (the final two corners are not used).
const route=path.slice(0,52), starts=[0,13,26,39];
const colors=['green','yellow','red','blue'];
let game;
function newGame(){game={current:0,dice:0,rolled:false,players:colors.map(color=>({color,positions:[-1,-1,-1,-1]}))};}
function makeBoard(){const board=document.getElementById('gameBoard');board.innerHTML='';
  for(let i=0;i<route.length;i++){const cell=document.createElement('div');cell.className='cell';cell.style.left=route[i].x*SIZE+'px';cell.style.top=route[i].y*SIZE+'px';if(i===0||i===13||i===26||i===39)cell.classList.add(colors[starts.indexOf(i)]);cell.classList.toggle('start',starts.includes(i));board.appendChild(cell)}
  [{c:'green',x:0,y:0},{c:'yellow',x:400,y:0},{c:'red',x:0,y:400},{c:'blue',x:400,y:400}].forEach(h=>{const el=document.createElement('div');el.className='home '+h.c;el.style.left=h.x+'px';el.style.top=h.y+'px';board.appendChild(el)});
}
function homePosition(player,index){const spots=[[50,50],[100,50],[50,100],[100,100]];const offsets=[[0,0],[400,0],[0,400],[400,400]][player];return{x:offsets[0]+spots[index][0],y:offsets[1]+spots[index][1]};}
function piecePosition(player,index){const progress=game.players[player].positions[index];if(progress<0||progress>=52)return homePosition(player,index);const spot=route[(starts[player]+progress)%52];return{x:spot.x*SIZE+5,y:spot.y*SIZE+5};}
function renderPieces(){const board=document.getElementById('gameBoard');board.querySelectorAll('.piece').forEach(p=>p.remove());game.players.forEach((player,pi)=>player.positions.forEach((_,i)=>{const p=document.createElement('div');p.className='piece '+player.color;p.id=`piece-${pi}-${i}`;p.textContent=i+1;const pos=piecePosition(pi,i);p.style.left=pos.x+'px';p.style.top=pos.y+'px';if(game.rolled&&pi===game.current&&canMove(pi,i))p.classList.add('movable');p.addEventListener('click',()=>movePiece(pi,i));board.appendChild(p)}));}
function canMove(pi,i){if(!game.rolled||pi!==game.current)return false;const pos=game.players[pi].positions[i];return pos<52&&(pos>=0||game.dice===6)&&(pos<0?1:pos+game.dice)<=52;}
function rollDice(){if(game.rolled)return;game.dice=Math.floor(Math.random()*6)+1;game.rolled=true;document.getElementById('dice').textContent=game.dice;document.getElementById('dice').style.transform='rotate(360deg)';setTimeout(()=>document.getElementById('dice').style.transform='',350);const movable=game.players[game.current].positions.some((_,i)=>canMove(game.current,i));if(movable){setStatus(`Player ${game.current+1} rolled ${game.dice}. Click a glowing piece.`)}else{setStatus(`Player ${game.current+1} rolled ${game.dice}, but has no valid move.`);setTimeout(nextTurn,900)};update();}
function movePiece(pi,i){if(!canMove(pi,i))return;const player=game.players[pi];player.positions[i]=player.positions[i]<0?0:player.positions[i]+game.dice;const finished=player.positions[i]===52;game.rolled=false;document.getElementById('dice').textContent='🎲';if(finished)setStatus(`Player ${pi+1} brought piece ${i+1} home!`);else setStatus(`Piece ${i+1} moved ${game.dice} space${game.dice===1?'':'s'}.`);if(game.dice!==6)setTimeout(nextTurn,700);update();}
function nextTurn(){game.current=(game.current+1)%4;game.rolled=false;game.dice=0;document.getElementById('dice').textContent='🎲';setStatus(`Player ${game.current+1}'s turn. Roll the dice.`);update();}
function setStatus(t){document.getElementById('statusText').textContent=t;}
function update(){document.getElementById('turnTitle').textContent=`Player ${game.current+1}'s turn`;document.getElementById('rollBtn').disabled=game.rolled;document.getElementById('playersContainer').innerHTML=game.players.map((p,i)=>`<div class="player-info ${p.color} ${i===game.current?'active':''}">Player ${i+1} (${p.color.toUpperCase()})</div>`).join('');renderPieces();}
function reset(){newGame();makeBoard();setStatus('Roll the dice to start.');update();}
document.getElementById('rollBtn').addEventListener('click',rollDice);document.getElementById('resetBtn').addEventListener('click',reset);reset();
</script>
</body>
</html>
